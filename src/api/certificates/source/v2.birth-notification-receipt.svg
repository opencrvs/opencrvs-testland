<svg width="583" height="842" viewBox="0 0 583 842" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="white" />

  <text font-family="Noto Sans" fill="#222222">
    <tspan x="56" y="96" font-size="22" font-weight="bold">Birth notification receipt</tspan>
    <tspan x="56" y="124" font-size="12" fill="#5b5b5b">Farajaland Civil Registration</tspan>

    <tspan x="56" y="184" font-size="11" fill="#5b5b5b">Tracking ID</tspan>
    <tspan x="56" y="204" font-size="15">{{$lookup $metadata "trackingId"}}</tspan>

    <tspan x="56" y="244" font-size="11" fill="#5b5b5b">Child</tspan>
    <tspan x="56" y="264" font-size="15">{{$lookup $declaration "child.name.fullname"}}</tspan>

    <tspan x="56" y="304" font-size="11" fill="#5b5b5b">Date of birth</tspan>
    <tspan x="56" y="324" font-size="15">{{$lookup $declaration "child.dob"}}</tspan>

    <tspan x="56" y="364" font-size="11" fill="#5b5b5b">Informant email</tspan>
    <tspan x="56" y="384" font-size="15">{{$lookup $declaration "informant.email"}}</tspan>

    <tspan x="56" y="424" font-size="11" fill="#5b5b5b">Status</tspan>
    <tspan x="56" y="444" font-size="15">{{#ifCond ($lookup $metadata 'legalStatuses.REGISTERED.registrationNumber') '!==' undefined}}REGISTERED{{else}}{{#ifCond ($lookup $metadata 'legalStatuses.DECLARED.acceptedAt') '!==' undefined}}DECLARED{{else}}IN PROGRESS{{/ifCond}}{{/ifCond}}</tspan>

    <tspan x="56" y="500" font-size="11" fill="#5b5b5b">Printed on</tspan>
    <tspan x="56" y="520" font-size="15">{{$lookup $metadata "modifiedAt"}}</tspan>

    <tspan x="56" y="792" font-size="10" fill="#767676">This receipt acknowledges the notification only. It is not a birth certificate.</tspan>
  </text>
</svg>
