services:
  # Configure reverse proxy for public endpoints
  # Note: these published port will override UFW rules as Docker manages it's own iptables
  # Only publish the exact ports that are required for OpenCRVS to work
  traefik:
    image: 'traefik:v2.11'
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /data/traefik/acme.json:/acme.json
    command:
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --providers.docker
      - --providers.docker.swarmMode=true
      - --api.dashboard=true
      - --api.insecure=true
      - --log.level=WARNING
      - --certificatesresolvers.certResolver.acme.email=riku@opencrvs.org
      - --certificatesresolvers.certResolver.acme.storage=acme.json
      - --certificatesresolvers.certResolver.acme.caserver=https://acme-v02.api.letsencrypt.org/directory
      - --certificatesresolvers.certResolver.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.certResolver.acme.httpchallenge=true
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --serverstransport.insecureskipverify=true
      - --entrypoints.websecure.address=:443
      - --accesslog=true
      - --accesslog.format=json
      - --ping=true
    deploy:
      replicas: 1
      labels:
        - 'traefik.http.services.traefik.loadbalancer.server.port=80'
        - 'traefik.http.middlewares.gzip-compression.compress=true'
      placement:
        constraints:
          - node.role == manager
    logging:
      driver: gelf
      options:
        gelf-address: 'udp://127.0.0.1:12201'
        tag: 'traefik'
    networks:
      - overlay_net

  filebeat:
    image: ghcr.io/opencrvs/filebeat:8.16.4
    user: root
    networks:
      - overlay_net
    configs:
      - source: filebeat.{{ts}}
        target: /usr/share/filebeat/filebeat.yml
      - source: filebeat-rollover-policy.{{ts}}
        target: /usr/share/filebeat/filebeat-rollover-policy.json
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers/:/var/lib/docker/containers/:ro
      - /var/log/:/var/log/:ro
    environment:
      - ELASTICSEARCH_HOST=elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_SUPERUSER_PASSWORD}
      - KIBANA_HOST=kibana:5601
    command: ['--strict.perms=false']
    deploy:
      mode: global
      labels:
        - 'traefik.enable=false'

  metricbeat:
    image: ghcr.io/opencrvs/metricbeat:8.16.4
    user: root
    cap_add:
      - SYS_PTRACE
    volumes:
      - /proc:/hostfs/proc:ro
      - /sys/fs/cgroup:/hostfs/sys/fs/cgroup:ro
      - /:/hostfs:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - ELASTICSEARCH_HOST=elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_SUPERUSER_PASSWORD}
      - KIBANA_HOST=kibana:5601
      - KIBANA_USERNAME=${KIBANA_USERNAME}
      - KIBANA_PASSWORD=${KIBANA_PASSWORD}
      - BEATS_USERNAME=beats_system
      - BEATS_PASSWORD=${ROTATING_METRICBEAT_ELASTIC_PASSWORD}
    command: ['--strict.perms=false', '-system.hostfs=/hostfs']
    hostname: 'metricbeat-{{.Node.Hostname}}'
    restart: always
    deploy:
      mode: global
      labels:
        - 'traefik.enable=false'
    networks:
      - overlay_net
    configs:
      - source: metricbeat-conf.{{ts}}
        target: /usr/share/metricbeat/metricbeat.yml
      - source: metricbeat-rollover-policy.{{ts}}
        target: /usr/share/metricbeat/rollover-policy.json
    logging:
      driver: gelf
      options:
        gelf-address: 'udp://127.0.0.1:12201'
        tag: 'metricbeat'
  setup-kibana-config:
    image: curlimages/curl:7.88.1
    entrypoint:
      [
        'curl',
        '-u',
        'kibana_system:${KIBANA_SYSTEM_PASSWORD}',
        '-X',
        'POST',
        'http://kibana:5601/api/saved_objects/_import?overwrite=true',
        '-H',
        'kbn-xsrf: true',
        '--form',
        'file=@/config.ndjson'
      ]
    restart: on-failure
    volumes:
      # Exceed Docker config file 500 kb file limit, thus a volume mount
      - '/opt/opencrvs/infrastructure/monitoring/kibana/config.ndjson:/config.ndjson'
    networks:
      - overlay_net
    deploy:
      labels:
        - 'traefik.enable=false'
      replicas: 1
      placement:
        constraints:
          - node.role == manager
    logging:
      driver: gelf
      options:
        gelf-address: 'udp://127.0.0.1:12201'
        tag: 'setup-kibana-config'
  kibana:
    image: ghcr.io/opencrvs/kibana:8.16.4
    restart: always
    deploy:
      labels:
        - 'traefik.enable=true'
        - 'traefik.http.routers.kibana.rule=Host(`kibana.{{hostname}}`)'
        - 'traefik.http.services.kibana.loadbalancer.server.port=5601'
        - 'traefik.http.routers.kibana.tls=true'
        - 'traefik.http.routers.kibana.tls.certresolver=certResolver'
        - 'traefik.http.routers.kibana.entrypoints=web,websecure'
        - 'traefik.docker.network=opencrvs_overlay_net'
        - 'traefik.http.middlewares.traefik.headers.stsseconds=31536000'
        - 'traefik.http.middlewares.traefik.headers.stsincludesubdomains=true'
        - 'traefik.http.middlewares.traefik.headers.stspreload=true'
    networks:
      - overlay_net
    environment:
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_SYSTEM_PASSWORD}
    configs:
      - source: kibana.{{ts}}
        target: /usr/share/kibana/config/kibana.yml
    logging:
      driver: gelf
      options:
        gelf-address: 'udp://127.0.0.1:12201'
        tag: 'kibana'
  # Configure mongo nodes as a replica set
  mongo1:
    command: mongod --auth --replSet rs0 --keyFile /etc/mongodb-keyfile
    hostname: 'mongo1'
    volumes:
      - '/data/mongo:/data/db'
      - '/mongodb-keyfile:/mongodb-keyfile'
    # https://github.com/docker-library/mongo/issues/475
    entrypoint:
      - bash
      - -c
      - |
        cp /mongodb-keyfile /etc/mongodb-keyfile
        chmod 400 /etc/mongodb-keyfile
        chown 999:999 /etc/mongodb-keyfile
        exec docker-entrypoint.sh $$@
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGODB_ADMIN_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_ADMIN_PASSWORD}
    deploy:
      replicas: 1
      labels:
        - 'traefik.enable=false'
      placement:
        constraints:
          - node.labels.data1 == true
    networks:
      - overlay_net
    logging:
      driver: gelf
      options:
        gelf-address: 'udp://127.0.0.1:12201'
        tag: 'mongo1'
  mongo-on-update:
    image: mongo:4.4
    command: bash /on-deploy.sh
    configs:
      - source: mongo-on-deploy.{{ts}}
        target: /on-deploy.sh
    deploy:
      labels:
        - traefik.enable=false
      replicas: 1
      # If this doesn't get run successfully, both the replica set in mongo and
      # the user schema remains uninitialized.
      restart_policy:
        condition: on-failure
        delay: 10s
    environment:
      - REPLICAS=1
      - MONGODB_ADMIN_USER=${MONGODB_ADMIN_USER}
      - MONGODB_ADMIN_PASSWORD=${MONGODB_ADMIN_PASSWORD}
      - USER_MGNT_MONGODB_PASSWORD=${USER_MGNT_MONGODB_PASSWORD}
      - HEARTH_MONGODB_PASSWORD=${HEARTH_MONGODB_PASSWORD}
      - PERFORMANCE_MONGODB_PASSWORD=${PERFORMANCE_MONGODB_PASSWORD}
      - EVENTS_MONGODB_PASSWORD=${EVENTS_MONGODB_PASSWORD}
    networks:
      - overlay_net
    logging:
      driver: gelf
      options:
        gelf-address: 'udp://127.0.0.1:12201'
        tag: 'mongo-on-update'
  # Configure redis
  redis:
    command: ['redis-server', '/usr/local/etc/redis/redis.conf']
    secrets:
      - source: redis-acl.{{ts}}
        target: /usr/local/etc/redis/users.acl
    configs:
      - source: redis-conf.{{ts}}
        target: /usr/local/etc/redis/redis.conf
    networks:
      - overlay_net
    deploy:
      labels:
        - traefik.enable=false
    logging:
      driver: gelf
      options:
        gelf-address: 'udp://127.0.0.1:12201'
        tag: 'redis'
  # Configure elasticsearch
  elasticsearch:
    image: ghcr.io/opencrvs/elasticsearch:8.16.4
    volumes:
      - '/data/elasticsearch:/usr/share/elasticsearch/data'
      - '/data/backups/elasticsearch:/data/backups/elasticsearch'
    configs:
      - source: jvm-options.{{ts}}
        target: /usr/share/elasticsearch/config/jvm.options.d/jvm.options
    deploy:
      resources:
        limits:
          memory: 8G
      replicas: 1
      labels:
        - 'traefik.enable=false'
      placement:
        constraints:
          - node.labels.data1 == true
    environment:
      - ELASTIC_PASSWORD=${ELASTICSEARCH_SUPERUSER_PASSWORD}
      - path.repo=/data/backups/elasticsearch
      - cluster.name=docker-cluster
      - network.host=0.0.0.0
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.authc.api_key.enabled=true
    networks:
      - overlay_net
    logging:
      driver: gelf
      options:
        gelf-address: 'udp://127.0.0.1:12201'
        tag: 'elasticsearch'

  # Configure elasticsearch
  minio:
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_DOMAIN=minio.{{hostname}}
      - MINIO_SERVER_URL=http://minio:9000
      - MINIO_BROWSER_REDIRECT_URL=https://minio-console.{{hostname}}
    volumes:
      - '/data/minio:/data'
    command: server --console-address ":9001" /data
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.data1 == true
      labels:
        - 'traefik.enable=true'
        - 'traefik.docker.network=opencrvs_overlay_net'
        # Console
        - 'traefik.http.routers.minio-console.rule=Host(`minio-console.{{hostname}}`)'
        - 'traefik.http.routers.minio-console.entrypoints=websecure'
        - 'traefik.http.routers.minio-console.tls.certresolver=certResolver'
        - 'traefik.http.routers.minio-console.service=minio-console'
        - 'traefik.http.services.minio-console.loadbalancer.server.port=9001'
        # API
        - 'traefik.http.routers.minio.rule=Host(`minio.{{hostname}}`)'
        - 'traefik.http.routers.minio.entrypoints=websecure,web'
        - 'traefik.http.routers.minio.tls.certresolver=certResolver'
        - 'traefik.http.routers.minio.tls=true'
        - 'traefik.http.routers.minio.service=minio'
        - 'traefik.http.routers.minio.middlewares=minio-https-redirect'
        - 'traefik.http.middlewares.minio-https-redirect.redirectscheme.scheme=https'
        - 'traefik.http.services.minio.loadbalancer.server.port=9000'
    networks:
      - overlay_net

  minio-mc:
    image: minio/mc:RELEASE.2025-05-21T01-59-54Z
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc admin trace --path ocrvs/* minio
      "
    configs:
      - source: minio-mc-config.{{ts}}
        target: /root/.mc/config.json
    networks:
      - overlay_net
    deploy:
      labels:
        - 'traefik.enable=false'
      placement:
        constraints:
          - node.role == manager
    logging:
      driver: gelf
      options:
        gelf-address: 'udp://127.0.0.1:12201'
        tag: 'minio'

  setup-elasticsearch-users:
    image: ubuntu:bionic
    entrypoint: ['bash', '/usr/app/setup.sh']
    restart: on-failure
    environment:
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTIC_PASSWORD=${ELASTICSEARCH_SUPERUSER_PASSWORD}
      - METRICBEAT_ELASTIC_PASSWORD=${ROTATING_METRICBEAT_ELASTIC_PASSWORD}
      - APM_ELASTIC_PASSWORD=${ROTATING_APM_ELASTIC_PASSWORD}
      - SEARCH_ELASTIC_USERNAME=search-user
      - SEARCH_ELASTIC_PASSWORD=${ROTATING_SEARCH_ELASTIC_PASSWORD}
      - KIBANA_SYSTEM_PASSWORD=${KIBANA_SYSTEM_PASSWORD}
      - KIBANA_USERNAME=${KIBANA_USERNAME}
      - KIBANA_PASSWORD=${KIBANA_PASSWORD}
    volumes:
      - '/opt/opencrvs/infrastructure/elasticsearch:/usr/app'
    networks:
      - overlay_net
    deploy:
      labels:
        - 'traefik.enable=false'
      replicas: 1
      placement:
        constraints:
          - node.role == manager
    logging:
      driver: gelf
      options:
        gelf-address: 'udp://127.0.0.1:12201'
        tag: 'setup-elasticsearch-users'
  elastalert:
    image: jertel/elastalert2:2.19.0
    restart: unless-stopped
    environment:
      - ES_USERNAME=elastic
      - ES_PASSWORD=${ELASTICSEARCH_SUPERUSER_PASSWORD}
    volumes:
      - '/opt/opencrvs/infrastructure/monitoring/elastalert/elastalert.yaml:/opt/elastalert/config.yaml'
      - '/opt/opencrvs/infrastructure/monitoring/elastalert/rules:/opt/elastalert/rules'
    networks:
      - overlay_net
    deploy:
      labels:
        - 'traefik.enable=false'
      replicas: 1
      placement:
        constraints:
          - node.role == manager
    logging:
      driver: gelf
      options:
        gelf-address: 'udp://127.0.0.1:12201'
        tag: 'elastalert'

  logstash:
    image: logstash:8.16.4
    command: logstash -f /etc/logstash/logstash.conf --verbose
    ports:
      - '12201:12201'
      - '12201:12201/udp'
    configs:
      - source: logstash-pipeline.{{ts}}
        target: /etc/logstash/logstash.conf
      - source: logstash.{{ts}}
        target: /usr/share/logstash/config/logstash.yml
    environment:
      - ELASTICSEARCH_SUPERUSER_PASSWORD=${ELASTICSEARCH_SUPERUSER_PASSWORD}
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_SUPERUSER_PASSWORD}
    networks:
      - overlay_net
    restart: always
    deploy:
      labels:
        - 'traefik.enable=false'
      replicas: 1
  apm-server:
    image: ghcr.io/opencrvs/apm-server:7.17.22
    cap_add: ['CHOWN', 'DAC_OVERRIDE', 'SETGID', 'SETUID']
    cap_drop: ['ALL']
    restart: always
    networks:
      - overlay_net
    deploy:
      labels:
        - 'traefik.enable=false'
      replicas: 1
    command:
      [
        'apm-server',
        '-e',
        '-c',
        'apm-server.yml',
        '-E',
        'output.elasticsearch.username=elastic',
        '-E',
        'output.elasticsearch.password=${ELASTICSEARCH_SUPERUSER_PASSWORD}',
        '-E',
        'kibana.username=${KIBANA_USERNAME}',
        '-E',
        'kibana.password=${KIBANA_PASSWORD}'
      ]
    configs:
      - source: apm.{{ts}}
        target: /usr/share/apm-server/apm-server.yml
    logging:
      driver: gelf
      options:
        gelf-address: 'udp://127.0.0.1:12201'
        tag: 'apm-server'
  # Configure webapps and add traefik config
  client:
    environment:
      - DECLARED_DECLARATION_SEARCH_QUERY_COUNT=100
      - COUNTRY_CONFIG_URL=https://countryconfig.{{hostname}}
      - COUNTRY_CONFIG_URL_INTERNAL=http://countryconfig:3040
      - LOGIN_URL=https://login.{{hostname}}
      - AUTH_URL_INTERNAL=http://auth:4040
      - GATEWAY_URL_INTERNAL=http://gateway:7070
      - CONTENT_SECURITY_POLICY_WILDCARD=${CONTENT_SECURITY_POLICY_WILDCARD}
    deploy:
      labels:
        - 'traefik.enable=true'
        - 'traefik.http.routers.client.rule=Host(`register.{{hostname}}`,`{{hostname}}`)'
        - 'traefik.http.routers.client.middlewares=test-replacepathregex,gzip-compression'
        - 'traefik.http.routers.client.service=client'
        - 'traefik.http.services.client.loadbalancer.server.port=3000'
        - 'traefik.http.routers.client.tls=true'
        - 'traefik.http.routers.client.tls.certresolver=certResolver'
        - 'traefik.http.routers.client.entrypoints=web,websecure'
        - 'traefik.docker.network=opencrvs_overlay_net'

        - 'traefik.http.middlewares.test-replacepathregex.redirectregex.permanent=true'
        - 'traefik.http.middlewares.test-replacepathregex.redirectregex.regex=^https?://{{hostname}}/(.*)'
        - 'traefik.http.middlewares.test-replacepathregex.redirectregex.replacement=https://register.{{hostname}}/$${1}'

        - 'traefik.http.middlewares.client.headers.customresponseheaders.Pragma=no-cache'
        - 'traefik.http.middlewares.client.headers.customresponseheaders.Cache-control=no-store'
        - 'traefik.http.middlewares.client.headers.customresponseheaders.X-Robots-Tag=none'
        - 'traefik.http.middlewares.client.headers.stsseconds=31536000'
        - 'traefik.http.middlewares.client.headers.stsincludesubdomains=true'
        - 'traefik.http.middlewares.client.headers.stspreload=true'
      replicas: 1
    networks:
      - overlay_net
    logging:
      driver: gelf
      options:
        gelf-address: 'udp://127.0.0.1:12201'
        tag: 'client'

  countryconfig:
    deploy:
      labels:
        - 'traefik.enable=true'
        - 'traefik.http.routers.countryconfig.rule=(Host(`countryconfig.{{hostname}}`)|| Host(`registry.{{hostname}}`)) && !Path(`/reindex`) && !Path(`/email`) && !Path(`/dashboards/queries.json`)'
        - 'traefik.http.services.countryconfig.loadbalancer.server.port=3040'
        - 'traefik.http.routers.countryconfig.tls=true'
        - 'traefik.http.routers.countryconfig.tls.certresolver=certResolver'
        - 'traefik.http.routers.countryconfig.entrypoints=web,websecure'
        - 'traefik.http.routers.countryconfig.middlewares=gzip-compression'
        - 'traefik.docker.network=opencrvs_overlay_net'
        - 'traefik.http.middlewares.countryconfig.headers.customresponseheaders.Pragma=no-cache'
        - 'traefik.http.middlewares.countryconfig.headers.customresponseheaders.Cache-control=no-store'
        - 'traefik.http.middlewares.countryconfig.headers.customresponseheaders.X-Robots-Tag=none'
        - 'traefik.http.middlewares.countryconfig.headers.stsseconds=31536000'
        - 'traefik.http.middlewares.countryconfig.headers.stsincludesubdomains=true'
        - 'traefik.http.middlewares.countryconfig.headers.stspreload=true'
        # This is an invalid IP range, effectively blocking all IPs from accessing below paths.
        # It's only meant to be accessed from the internal docker network.
        - 'traefik.http.middlewares.block-internal-routes.ipwhitelist.sourcerange=255.255.255.255'
        - 'traefik.http.routers.block-email.rule=Host(`countryconfig.{{hostname}}`) && Path(`/email`)'
        - 'traefik.http.routers.block-email.middlewares=block-internal-routes'
        - 'traefik.http.routers.block-reindex.rule=Host(`countryconfig.{{hostname}}`) && Path(`/reindex`)'
        - 'traefik.http.routers.block-reindex.middlewares=block-internal-routes'
        - 'traefik.http.routers.block-dashboard-queries.rule=Host(`countryconfig.{{hostname}}`) && Path(`/dashboards/queries.json`)'
        - 'traefik.http.routers.block-dashboard-queries.middlewares=block-internal-routes'
      replicas: 1
    environment:
      - NODE_ENV=production
      - OPENCRVS_ENVIRONMENT=production
      - AUTH_URL=http://auth:4040
      - MONGO_URL=mongodb://mongo1/user-mgnt?replicaSet=rs0
      - APN_SERVICE_URL=http://apm-server:8200
      - COUNTRY_CONFIG_URL=https://countryconfig.{{hostname}}
      - LOGIN_URL=https://login.{{hostname}}
      # This needs to be the internal swarm url
      # as containers cannot connect to the web
      - GATEWAY_URL=http://gateway:7070
      - CLIENT_APP_URL=https://register.{{hostname}}
      - NOTIFICATION_TRANSPORT=${NOTIFICATION_TRANSPORT}
      - ALERT_EMAIL=${ALERT_EMAIL:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_SECURE=${SMTP_SECURE:-}
      - INFOBIP_GATEWAY_ENDPOINT=${INFOBIP_GATEWAY_ENDPOINT:-}
      - INFOBIP_API_KEY=${INFOBIP_API_KEY:-}
      - INFOBIP_SENDER_ID=${INFOBIP_SENDER_ID:-}
      - DOMAIN={{hostname}}
      - ANALYTICS_DATABASE_URL=postgres://events_analytics:${ANALYTICS_POSTGRES_PASSWORD}@postgres/events
      - REFERENCE_DATA_DATABASE_URL=${REFERENCE_DATA_DATABASE_URL}
      # Identity mock
      - ESIGNET_REDIRECT_URL=https://esignet-mock.{{hostname}}/authorize
      - MOSIP_API_USERINFO_URL=https://mosip-api.{{hostname}}/esignet/get-oidp-user-info
      - OPENID_PROVIDER_CLAIMS=name,family_name,given_name,middle_name,birthdate,address
      - OPENID_PROVIDER_CLIENT_ID=mock-client_id
    networks:
      - overlay_net
    logging:
      driver: gelf
      options:
        gelf-address: 'udp://127.0.0.1:12201'
        tag: 'countryconfig'
  login:
    environment:
      - COUNTRY_CONFIG_URL=https://countryconfig.{{hostname}}
      - COUNTRY_CONFIG_URL_INTERNAL=http://countryconfig:3040
      - CLIENT_APP_URL=https://register.{{hostname}}
      - AUTH_URL_INTERNAL=http://auth:4040
      - GATEWAY_URL_INTERNAL=http://gateway:7070
      - CONTENT_SECURITY_POLICY_WILDCARD=${CONTENT_SECURITY_POLICY_WILDCARD}
    deploy:
      labels:
        - 'traefik.enable=true'
        - 'traefik.http.routers.login.rule=Host(`login.{{hostname}}`)'
        - 'traefik.http.services.login.loadbalancer.server.port=3020'
        - 'traefik.http.routers.login.tls=true'
        - 'traefik.http.routers.login.tls.certresolver=certResolver'
        - 'traefik.http.routers.login.entrypoints=web,websecure'
        - 'traefik.http.routers.login.middlewares=gzip-compression'
        - 'traefik.docker.network=opencrvs_overlay_net'
        - 'traefik.http.middlewares.login.headers.customresponseheaders.Pragma=no-cache'
        - 'traefik.http.middlewares.login.headers.customresponseheaders.Cache-control=no-store'
        - 'traefik.http.middlewares.login.headers.customresponseheaders.X-Robots-Tag=none'
        - 'traefik.http.middlewares.login.headers.stsseconds=31536000'
        - 'traefik.http.middlewares.login.headers.stsincludesubdomains=true'
        - 'traefik.http.middlewares.login.headers.stspreload=true'
      replicas: 1
    networks:
      - overlay_net
    logging:
      driver: gelf
      options:
        gelf-address: 'udp://127.0.0.1:12201'
        tag: 'login'
  # Configure other service with deployment specifc details
  auth:
    secrets:
      - jwt-public-key.{{ts}}
      - jwt-private-key.{{ts}}
    environment:
      - NODE_ENV=production
      - SENTRY_DSN=${SENTRY_DSN:-}
      - APN_SERVICE_URL=http://apm-server:8200
      - CERT_PRIVATE_KEY_PATH=/run/secrets/jwt-private-key.{{ts}}
      - CERT_PUBLIC_KEY_PATH=/run/secrets/jwt-public-key.{{ts}}
      - DOMAIN={{hostname}}
      - REDIS_USERNAME=${AUTH_REDIS_USERNAME}
      - REDIS_PASSWORD=${AUTH_REDIS_PASSWORD}
    deploy:
      labels:
        - 'traefik.enable=false'
      replicas: 1
    networks:
      - overlay_net
    logging:
      driver: gelf
      options:
        gelf-address: 'udp://127.0.0.1:12201'
        tag: 'auth'
  events:
    secrets:
      - jwt-public-key.{{ts}}
    environment:
      - NODE_ENV=production
      - APN_SERVICE_URL=http://apm-server:8200
      - EVENTS_MONGO_URL=mongodb://events:${EVENTS_MONGODB_PASSWORD}@mongo1/events?replicaSet=rs0
      - USER_MGNT_MONGO_URL=mongodb://user-mgnt:${USER_MGNT_MONGODB_PASSWORD}@mongo1/user-mgnt?replicaSet=rs0
      - ES_URL=http://search-user:${ROTATING_SEARCH_ELASTIC_PASSWORD}@elasticsearch:9200
      - EVENTS_POSTGRES_URL=postgres://events_app:${EVENTS_APP_POSTGRES_PASSWORD}@postgres/events
      - CERT_PUBLIC_KEY_PATH=/run/secrets/jwt-public-key.{{ts}}
    deploy:
      labels:
        - 'traefik.enable=false'
      replicas: 1
    networks:
      - overlay_net
    logging:
      driver: gelf
      options:
        gelf-address: 'udp://127.0.0.1:12201'
        tag: 'events'
  gateway:
    secrets:
      - jwt-public-key.{{ts}}
    environment:
      - NODE_ENV=production
      - LANGUAGES=en,fr
      - SENTRY_DSN=${SENTRY_DSN:-}
      - APN_SERVICE_URL=http://apm-server:8200
      - CERT_PUBLIC_KEY_PATH=/run/secrets/jwt-public-key.{{ts}}
      - LOGIN_URL=https://login.{{hostname}}
      - CLIENT_APP_URL=https://register.{{hostname}}
      - DOMAIN={{hostname}}
      - COUNTRY=${COUNTRY:-FAR}
      - REDIS_USERNAME=${GATEWAY_REDIS_USERNAME}
      - REDIS_PASSWORD=${GATEWAY_REDIS_PASSWORD}
    deploy:
      labels:
        - 'traefik.enable=true'
        - 'traefik.http.routers.gateway.rule=Host(`gateway.{{hostname}}`)'
        - 'traefik.http.services.gateway.loadbalancer.server.port=7070'
        - 'traefik.http.routers.gateway.tls=true'
        - 'traefik.http.routers.gateway.tls.certresolver=certResolver'
        - 'traefik.http.routers.gateway.entrypoints=web,websecure'
        - 'traefik.http.routers.gateway.middlewares=gzip-compression'
        - 'traefik.docker.network=opencrvs_overlay_net'
        - 'traefik.http.middlewares.gateway.headers.customresponseheaders.Pragma=no-cache'
        - 'traefik.http.middlewares.gateway.headers.customresponseheaders.Cache-control=no-store'
        - 'traefik.http.middlewares.gateway.headers.customresponseheaders.X-Robots-Tag=none'
        - 'traefik.http.middlewares.gateway.headers.stsseconds=31536000'
        - 'traefik.http.middlewares.gateway.headers.stsincludesubdomains=true'
        - 'traefik.http.middlewares.gateway.headers.stspreload=true'
      replicas: 1
    networks:
      - overlay_net
    logging:
      driver: gelf
      options:
        gelf-address: 'udp://127.0.0.1:12201'
        tag: 'gateway'
  documents:
    deploy:
      replicas: 1
      labels:
        - 'traefik.enable=false'
    secrets:
      - jwt-public-key.{{ts}}
    environment:
      - NODE_ENV=production
      - APN_SERVICE_URL=http://apm-server:8200
      - CERT_PUBLIC_KEY_PATH=/run/secrets/jwt-public-key.{{ts}}
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - MINIO_URL=minio.{{hostname}}
      - MINIO_HOST=minio
      - MINIO_PORT=9000
      - MINIO_BUCKET=ocrvs
    networks:
      - overlay_net
    logging:
      driver: gelf
      options:
        gelf-address: 'udp://127.0.0.1:12201'
        tag: 'documents'
  migration:
    environment:
      - USER_MGNT_MONGO_URL=mongodb://user-mgnt:${USER_MGNT_MONGODB_PASSWORD}@mongo1/user-mgnt?replicaSet=rs0
      - DASHBOARD_MONGO_URL=mongodb://performance:${PERFORMANCE_MONGODB_PASSWORD}@mongo1/performance?replicaSet=rs0
      - HEARTH_MONGO_URL=mongodb://hearth:${HEARTH_MONGODB_PASSWORD}@mongo1/hearth-dev?replicaSet=rs0
      - EVENTS_MONGO_URL=mongodb://events:${EVENTS_MONGODB_PASSWORD}@mongo1/events?replicaSet=rs0
      - EVENTS_POSTGRES_URL=postgres://events_migrator:${EVENTS_MIGRATOR_POSTGRES_PASSWORD}@postgres/events
      - ES_HOST=search-user:${ROTATING_SEARCH_ELASTIC_PASSWORD}@elasticsearch:9200
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - MINIO_HOST=minio
      - MINIO_PORT=9000
      - MINIO_BUCKET=ocrvs
      - SUPER_USER_PASSWORD=${SUPER_USER_PASSWORD}
    deploy:
      labels:
        - 'traefik.enable=false'
      replicas: 1
      restart_policy:
        condition: on-failure
    networks:
      - overlay_net
    logging:
      driver: gelf
      options:
        gelf-address: 'udp://127.0.0.1:12201'
        tag: 'migration'

  legacy-data-migration:
    image: ghcr.io/opencrvs/ocrvs-migration:${VERSION}
    command:
      ['/bin/sh', '-c', '/app/wait && yarn start:prod --migrate-legacy-data']
    environment:
      - USER_MGNT_MONGO_URL=mongodb://user-mgnt:${USER_MGNT_MONGODB_PASSWORD}@mongo1/user-mgnt?replicaSet=rs0
      - DASHBOARD_MONGO_URL=mongodb://performance:${PERFORMANCE_MONGODB_PASSWORD}@mongo1/performance?replicaSet=rs0
      - HEARTH_MONGO_URL=mongodb://hearth:${HEARTH_MONGODB_PASSWORD}@mongo1/hearth-dev?replicaSet=rs0
      - EVENTS_MONGO_URL=mongodb://events:${EVENTS_MONGODB_PASSWORD}@mongo1/events?replicaSet=rs0
      - EVENTS_POSTGRES_URL=postgres://events_migrator:${EVENTS_MIGRATOR_POSTGRES_PASSWORD}@postgres/events
      - EVENTS_SUPERUSER_POSTGRES_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/events
      - ES_HOST=search-user:${ROTATING_SEARCH_ELASTIC_PASSWORD}@elasticsearch:9200
      - WAIT_HOSTS=mongo1:27017,minio:9000,elasticsearch:9200
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - MINIO_HOST=minio
      - MINIO_PORT=9000
      - MINIO_BUCKET=ocrvs
      - SUPER_USER_PASSWORD=${SUPER_USER_PASSWORD}
      - MONGO_HOST=mongo1
      - MONGO_PORT=27017
      - MONGO_USERNAME=${MONGODB_ADMIN_USER}
      - MONGO_PASSWORD=${MONGODB_ADMIN_PASSWORD}
      - MONGO_REPLICA_SET=rs0
    deploy:
      labels:
        - 'traefik.enable=false'
      replicas: 1
      restart_policy:
        condition: on-failure
    networks:
      - overlay_net
    logging:
      driver: gelf
      options:
        gelf-address: 'udp://127.0.0.1:12201'
        tag: 'legacy-data-migration'

  postgres:
    image: docker.io/chumaky/postgres_mongo_fdw:17.6_fdw5.5.2
    networks:
      - overlay_net
    restart: unless-stopped
    volumes:
      - /data/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    deploy:
      replicas: 1
      labels:
        - 'traefik.enable=false'
      placement:
        constraints:
          - node.labels.data1 == true

  postgres-on-update:
    image: postgres:17.6
    command:
      [
        'bash',
        '-c',
        'bash /on-deploy.sh && bash /setup-analytics.sh && bash /setup-reference-data.sh'
      ]
    configs:
      - source: postgres-on-deploy.{{ts}}
        target: /on-deploy.sh
      - source: postgres-analytics-on-deploy.{{ts}}
        target: /setup-analytics.sh
      - source: postgres-reference-data-on-deploy.{{ts}}
        target: /setup-reference-data.sh
    deploy:
      labels:
        - traefik.enable=false
      replicas: 1
      restart_policy:
        condition: on-failure
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - ANALYTICS_POSTGRES_USER=events_analytics
      - ANALYTICS_POSTGRES_PASSWORD=${ANALYTICS_POSTGRES_PASSWORD}
      - EVENTS_APP_POSTGRES_PASSWORD=${EVENTS_APP_POSTGRES_PASSWORD}
      - EVENTS_MIGRATOR_POSTGRES_PASSWORD=${EVENTS_MIGRATOR_POSTGRES_PASSWORD}
      - REFERENCE_DATA_POSTGRES_USER=${REFERENCE_DATA_POSTGRES_USER}
      - REFERENCE_DATA_POSTGRES_PASSWORD=${REFERENCE_DATA_POSTGRES_PASSWORD}
      - REFERENCE_DATA_EDITOR_USER=${REFERENCE_DATA_EDITOR_USER}
      - REFERENCE_DATA_EDITOR_PASSWORD=${REFERENCE_DATA_EDITOR_PASSWORD}
      - KEEP_ALIVE_SECONDS=10
    networks:
      - overlay_net

  dashboards:
    image: metabase/metabase:v0.56.4
    volumes:
      # Exceed Docker config file 500 kb file limit, thus a volume mount
      - /opt/opencrvs/infrastructure/metabase/metabase.init.db.sql:/metabase.init.db.sql
      - /opt/opencrvs/infrastructure/metabase/run.sh:/run.sh
      - /opt/opencrvs/infrastructure/metabase/initialize-database.sh:/initialize-database.sh
      - /opt/opencrvs/infrastructure/metabase/update-database.sh:/update-database.sh
      - /opt/opencrvs/infrastructure/metabase/environment-configuration.sql:/environment-configuration.sql
    entrypoint: ['/bin/sh', '/run.sh']
    networks:
      - overlay_net
    environment:
      # Database credentials for PostgreSQL connection
      - METABASE_DATABASE_SSL=${METABASE_DATABASE_SSL:-false}
      - METABASE_DATABASE_HOST=${METABASE_DATABASE_HOST:-postgres}
      - METABASE_DATABASE_PORT=${METABASE_DATABASE_PORT:-5432}
      - METABASE_DATABASE_NAME=${METABASE_DATABASE_NAME:-events}
      - METABASE_DATABASE_USER=${METABASE_DATABASE_USER:-events_analytics}
      - METABASE_DATABASE_PASSWORD=${ANALYTICS_POSTGRES_PASSWORD}

      - OPENCRVS_METABASE_SITE_NAME=OpenCRVS Dashboards
      - OPENCRVS_METABASE_SITE_URL=http://metabase.{{hostname}}
      - OPENCRVS_METABASE_MAP_NAME=Farajaland
      - OPENCRVS_METABASE_MAP_URL=http://countryconfig:3040/content/map.geojson
      - OPENCRVS_METABASE_MAP_REGION_KEY=State
      - OPENCRVS_METABASE_MAP_REGION_NAME=State
      - OPENCRVS_METABASE_ADMIN_EMAIL=${OPENCRVS_METABASE_ADMIN_EMAIL}
      - OPENCRVS_METABASE_ADMIN_PASSWORD=${OPENCRVS_METABASE_ADMIN_PASSWORD}
      - METABASE_JAR=/app/metabase.jar
      - MB_DB_INIT_SQL_FILE=/metabase.init.db.sql
      - MB_DB_FILE=/data/metabase/metabase.mv.db
      - OPENCRVS_ENVIRONMENT_CONFIGURATION_SQL_FILE=/environment-configuration.sql

    deploy:
      labels:
        - 'traefik.enable=true'
        - 'traefik.http.routers.metabase.rule=Host(`metabase.{{hostname}}`)'
        - 'traefik.http.services.metabase.loadbalancer.server.port=4444'
        - 'traefik.http.routers.metabase.tls=true'
        - 'traefik.http.routers.metabase.tls.certresolver=certResolver'
        - 'traefik.http.routers.metabase.entrypoints=web,websecure'
        - 'traefik.docker.network=opencrvs_overlay_net'
        - 'traefik.http.middlewares.metabase.headers.customresponseheaders.Pragma=no-cache'
        - 'traefik.http.middlewares.metabase.headers.customresponseheaders.Cache-control=no-store'
        - 'traefik.http.middlewares.metabase.headers.customresponseheaders.X-Robots-Tag=none'
        - 'traefik.http.middlewares.metabase.headers.stsseconds=31536000'
        - 'traefik.http.middlewares.metabase.headers.stsincludesubdomains=true'
        - 'traefik.http.middlewares.metabase.headers.stspreload=true'
      replicas: 1
      placement:
        constraints:
          - node.labels.data1 == true

  mosip-api:
    volumes:
      - /data/sqlite:/data/sqlite
      - /certs:/certs:ro
    image: ghcr.io/opencrvs/mosip-api:2.0.0-rc.11
    environment:
      - NODE_ENV=production
      - OPENCRVS_GATEWAY_URL=http://gateway:7070
      - OPENCRVS_PUBLIC_KEY_URL=http://auth:4040/.well-known
      - LOCALE=en
      - ESIGNET_USERINFO_URL=http://esignet-mock:20260/oidc/userinfo
      - ESIGNET_TOKEN_URL=http://esignet-mock:20260/oauth/token
      - OIDP_CLIENT_PRIVATE_KEY_PATH=/certs/esignet-jwk.txt
      - OPENID_PROVIDER_CLAIMS=name,family_name,given_name,middle_name,birthdate,address
      - DECRYPT_P12_FILE_PATH=/certs/keystore.p12
      - DECRYPT_P12_FILE_PASSWORD=mosip123
      - ENCRYPT_CERT_PATH=/certs/ida-partner.crt
      - IDA_AUTH_DOMAIN_URI=http://mosip-mock:20240/
      - IDA_AUTH_URL=http://mosip-mock:20240/idauthentication/v1/auth
      - PARTNER_APIKEY=123456
      - PARTNER_ID=aaaaaAAAAAbbbbbBBBBBcccccCCCCCdddddDDDDD
      - PARTNER_MISP_LK=crvs-partner
      - SIGN_P12_FILE_PATH=/certs/keystore.p12
      - SIGN_P12_FILE_PASSWORD=mosip123
      - CLIENT_APP_URL=https://register.{{hostname}}
      - SQLITE_DATABASE_PATH=/data/sqlite/mosip-api.db
      - MOSIP_AUTH_URL=http://mosip-mock:20240/v1/authmanager/authenticate/clientidsecretkey
      - MOSIP_AUTH_CLIENT_APP_ID=admin
      - MOSIP_PACKET_AUTH_CLIENT_ID=mosip-regproc-client
      - MOSIP_PACKET_AUTH_CLIENT_SECRET=abcdeABCDE123456
      - MOSIP_WEBSUB_AUTH_CLIENT_ID=mosip-websub-client
      - MOSIP_WEBSUB_AUTH_CLIENT_SECRET=abcdeABCDE123456
      - MOSIP_WEBSUB_CALLBACK_URL=http://mosip-api:2024/websub/callback
      - MOSIP_WEBSUB_HUB_URL=http://mosip-mock:20240/websub/hub
      - MOSIP_WEBSUB_SECRET=mosip-websub-secret
      - MOSIP_WEBSUB_TOPIC=CREDENTIAL_ISSUED
      - MOSIP_CREATE_PACKET_URL=http://mosip-mock:20240/commons/v1/packetmanager/createPacket
      - MOSIP_PROCESS_PACKET_URL=http://mosip-mock:20240/registrationprocessor/v1/workflowmanager/workflowinstance
      - MOSIP_VERIFIABLE_CREDENTIAL_ALLOWLIST=http://mosip-mock:20240/.well-known/public-key.json
      - MOSIP_CENTER_ID=10123
      - MOSIP_MACHINE_ID=10234
    deploy:
      replicas: 1
      labels:
        - 'traefik.enable=true'
        - 'traefik.http.routers.mosip-api.rule=Host(`mosip-api.{{hostname}}`)'
        - 'traefik.http.services.mosip-api.loadbalancer.server.port=2024'
        - 'traefik.http.routers.mosip-api.tls=true'
        - 'traefik.http.routers.mosip-api.tls.certresolver=certResolver'
        - 'traefik.http.routers.mosip-api.entrypoints=web,websecure'
        - 'traefik.http.routers.mosip-api.middlewares=gzip-compression'
        - 'traefik.docker.network=opencrvs_overlay_net'
        - 'traefik.http.middlewares.mosip-api.headers.customresponseheaders.Pragma=no-cache'
        - 'traefik.http.middlewares.mosip-api.headers.customresponseheaders.Cache-control=no-store'
        - 'traefik.http.middlewares.mosip-api.headers.customresponseheaders.X-Robots-Tag=none'
        - 'traefik.http.middlewares.mosip-api.headers.stsseconds=31536000'
        - 'traefik.http.middlewares.mosip-api.headers.stsincludesubdomains=true'
        - 'traefik.http.middlewares.mosip-api.headers.stspreload=true'
    networks:
      - overlay_net
    logging:
      driver: gelf
      options:
        gelf-address: 'udp://127.0.0.1:12201'
        tag: 'mosip-api'

  mosip-mock:
    image: ghcr.io/opencrvs/mosip-mock:2.0.0-rc.11
    depends_on:
      - mosip-api
    environment:
      - NODE_ENV=production
      - SENDER_EMAIL_ADDRESS=${SENDER_EMAIL_ADDRESS}
      - ALERT_EMAIL=${ALERT_EMAIL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_SECURE=${SMTP_SECURE}
      - MOSIP_WEBSUB_CALLBACK_URL=http://mosip-api:2024/websub/callback
      - ISSUER_URL=http://mosip-mock:20240
      - MOSIP_WEBSUB_TOPIC=CREDENTIAL_ISSUED
    networks:
      - overlay_net
    logging:
      driver: gelf
      options:
        gelf-address: 'udp://127.0.0.1:12201'
        tag: 'mosip-mock'

  esignet-mock:
    image: ghcr.io/opencrvs/esignet-mock:2.0.0-rc.11
    volumes:
      - /certs:/certs:ro
    environment:
      - NODE_ENV=production
      - CLIENT_APP_URL=https://register.{{hostname}}
      - OIDP_CLIENT_PRIVATE_KEY_PATH=/certs/esignet-jwk.txt
    deploy:
      replicas: 1
      labels:
        - 'traefik.enable=true'
        - 'traefik.http.routers.esignet-mock.rule=Host(`esignet-mock.{{hostname}}`)'
        - 'traefik.http.services.esignet-mock.loadbalancer.server.port=20260'
        - 'traefik.http.routers.esignet-mock.tls=true'
        - 'traefik.http.routers.esignet-mock.tls.certresolver=certResolver'
        - 'traefik.http.routers.esignet-mock.entrypoints=web,websecure'
        - 'traefik.http.routers.esignet-mock.middlewares=gzip-compression'
        - 'traefik.docker.network=opencrvs_overlay_net'
        - 'traefik.http.middlewares.esignet-mock.headers.customresponseheaders.Pragma=no-cache'
        - 'traefik.http.middlewares.esignet-mock.headers.customresponseheaders.Cache-control=no-store'
        - 'traefik.http.middlewares.esignet-mock.headers.customresponseheaders.X-Robots-Tag=none'
        - 'traefik.http.middlewares.esignet-mock.headers.stsseconds=31536000'
        - 'traefik.http.middlewares.esignet-mock.headers.stsincludesubdomains=true'
        - 'traefik.http.middlewares.esignet-mock.headers.stspreload=true'
    networks:
      - overlay_net
    logging:
      driver: gelf
      options:
        gelf-address: 'udp://127.0.0.1:12201'
        tag: 'esignet-mock'
secrets:
  redis-acl.{{ts}}:
    external: true
  jwt-public-key.{{ts}}:
    external: true
  jwt-private-key.{{ts}}:
    external: true
configs:
  hearth-check-dupe-plugin.{{ts}}:
    file: /opt/opencrvs/infrastructure/hearth-plugins/checkDuplicateTask.js
  hearth-queryparam-extensions-conf.{{ts}}:
    file: /opt/opencrvs/infrastructure/hearth-queryparam-extensions.json
  metricbeat-conf.{{ts}}:
    file: /opt/opencrvs/infrastructure/monitoring/metricbeat/metricbeat.yml
  filebeat.{{ts}}:
    file: /opt/opencrvs/infrastructure/monitoring/filebeat/filebeat.yml
  mongo-on-deploy.{{ts}}:
    file: /opt/opencrvs/infrastructure/mongodb/on-deploy.sh
  postgres-on-deploy.{{ts}}:
    file: /opt/opencrvs/infrastructure/postgres/on-deploy.sh
  postgres-analytics-on-deploy.{{ts}}:
    file: /opt/opencrvs/infrastructure/postgres/setup-analytics.sh
  postgres-reference-data-on-deploy.{{ts}}:
    file: /opt/opencrvs/infrastructure/postgres/setup-reference-data.sh
  filebeat-rollover-policy.{{ts}}:
    file: /opt/opencrvs/infrastructure/monitoring/filebeat/filebeat-rollover-policy.json
  metricbeat-rollover-policy.{{ts}}:
    file: /opt/opencrvs/infrastructure/monitoring/metricbeat/metricbeat-rollover-policy.json
  kibana.{{ts}}:
    file: /opt/opencrvs/infrastructure/monitoring/kibana/kibana.yml
  apm.{{ts}}:
    file: /opt/opencrvs/infrastructure/monitoring/apm/apm-server.yml
  logstash.{{ts}}:
    file: /opt/opencrvs/infrastructure/monitoring/logstash/logstash.yml
  logstash-pipeline.{{ts}}:
    file: /opt/opencrvs/infrastructure/monitoring/logstash/logstash.conf
  jvm-options.{{ts}}:
    file: /opt/opencrvs/infrastructure/elasticsearch/jvm.options
  minio-mc-config.{{ts}}:
    file: /opt/opencrvs/infrastructure/mc-config/config.json
  redis-conf.{{ts}}:
    file: /opt/opencrvs/infrastructure/redis/redis.conf
networks:
  overlay_net:
    driver: overlay
    attachable: true
