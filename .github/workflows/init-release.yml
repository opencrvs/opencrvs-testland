# Gitflow release initialisation workflow.
#
# Triggered by opencrvs-core's init-release workflow (or manually) with a
# semver version string (e.g. 1.7.2).
#
# Farajaland is a mirror of opencrvs-countryconfig with farajaland-specific
# modifications on top. Version bumps and CHANGELOG entries live in
# countryconfig; farajaland inherits them by merging countryconfig's release
# branch. What this workflow does, in order:
#   1. Derives the base branch:
#        - patch release (z > 0)  → release/<x>.<y>.<z-1>  (must already exist)
#        - minor/major (z = 0)    → develop
#   2. Waits for countryconfig's release/<version> branch to appear (both
#      workflows are triggered in parallel by core's init-release).
#   3. Creates a release branch from the farajaland base branch, then merges
#      countryconfig's release branch in to inherit version-bump commits.
#   4. Opens the PRs:
#        a. release/<version> → master  (the release PR, only when the release
#           is on the channel master tracks)
#        b. merge-back/release-<version>-into-<target> → <target>
#           develop for a release on the current channel; for an older-channel
#           hotfix, the release branch one channel up — and then no PR to
#           master is opened at all, because the hotfix reaches master and
#           develop through that branch. opencrvs-core resolves the target and
#           passes it in via the target_branch input.
#
# TODO: this repo only cuts a release branch per core release on the 1.9.x
# line. Once this branch is merged into develop, this workflow and the PRs it
# opens can be removed — from that point on opencrvs-testland is no longer
# released alongside opencrvs-core.
name: Release - Start a new release
on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
        description: 'Version to release'
      target_branch:
        type: string
        required: false
        default: 'master'
        description: 'Branch this release merges into. Passed down by opencrvs-core. Leave as master for a release on the current channel; set to the release branch one channel up (e.g. release/2.0.2) for an older-channel hotfix.'

jobs:
  release_workflow:
    runs-on: ubuntu-latest
    steps:
      # Full history is needed for git operations below.
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Derive base_branch and the merge targets from the version number.
      #   - patch (z > 0): base = release/<x>.<y>.<z-1>
      #     The previous release branch must already exist; if not, the step
      #     fails early with a clear message rather than branching from an
      #     unexpected point.
      #   - minor/major (z = 0): base = develop
      - name: Determine the Base Branch
        id: get_base_branch
        run: |
          version="${{ inputs.version }}"

          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version was provided as input: $version" >&2
            echo "Please follow semver format for versioning, e/g 1.7.2"
            exit 1
          fi

          IFS='.' read -r x y z <<< "$version"
          if [ "$z" = "0" ]; then
            base_branch="develop"
          else
            previous_version="$((x)).$((y)).$((z-1))"
            base_branch="release/$previous_version"
            if ! git ls-remote --exit-code --heads origin "$base_branch"; then
              echo "The branch $base_branch does not exist. Please create it before starting a new patch release." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi
          # opencrvs-core is the single source of truth for where a release
          # merges: it knows which channel master currently tracks and passes the
          # resolved branch down when it dispatches this workflow. This repo does
          # not re-derive it -- its own version files and branch history are not a
          # reliable signal.
          #
          #   target = master        -> release is on the current channel: a
          #                             release PR to master plus a merge-back
          #                             PR to develop.
          #   target = release/<v>   -> older-channel hotfix climbing to the next
          #                             channel up. No release PR to master; a
          #                             single merge-back PR into that branch,
          #                             through which it reaches master and
          #                             develop.
          target_branch="${{ inputs.target_branch }}"
          if [ -z "$target_branch" ]; then
            target_branch="master"
          fi

          if [ "$target_branch" = "master" ]; then
            release_pr="true"
            merge_back_target="develop"
            target_slug="develop"
          else
            release_pr="false"
            merge_back_target="$target_branch"
            target_slug=$(echo "${target_branch#release/}" | tr -d '.')
          fi

          # Dots are stripped from both versions (e.g. 1.9.17 into 2.0.2 ->
          # release-1917-into-202) so the branch name stays within the branch
          # name validation used across the OpenCRVS repos.
          mergeback_branch="merge-back/release-$(echo "$version" | tr -d '.')-into-$target_slug"

          echo "Release PR to master: $release_pr | merge-back: $mergeback_branch -> $merge_back_target"
          echo "target_branch=$target_branch" >> $GITHUB_OUTPUT
          echo "release_pr=$release_pr" >> $GITHUB_OUTPUT
          echo "merge_back_target=$merge_back_target" >> $GITHUB_OUTPUT
          echo "mergeback_branch=$mergeback_branch" >> $GITHUB_OUTPUT
          echo "base_branch=$base_branch" >> $GITHUB_OUTPUT

      # The target release branch must already exist. This workflow never cuts
      # the next channel's release branch: that release writes its own version
      # bump and CHANGELOG, and a placeholder here would make its own
      # init-release run skip them. Fail now, before anything is created.
      - name: Verify the target release branch exists
        if: steps.get_base_branch.outputs.release_pr == 'false'
        run: |
          TARGET_BRANCH="${{ steps.get_base_branch.outputs.target_branch }}"
          if ! git ls-remote --exit-code --heads origin "$TARGET_BRANCH" > /dev/null 2>&1; then
            echo "::error::$TARGET_BRANCH does not exist in this repository. Initialise ${TARGET_BRANCH#release/} here first, or re-run with the target_branch input set explicitly."
            exit 1
          fi
          echo "$TARGET_BRANCH exists."

      - name: Check if release branch already exists
        id: check_branch
        run: |
          if git ls-remote --exit-code --heads origin "release/${{ inputs.version }}" > /dev/null 2>&1; then
            echo "Branch release/${{ inputs.version }} already exists, skipping creation."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # Poll for countryconfig's release branch before creating farajaland's.
      # Both workflows are triggered at the same time by core's init-release,
      # so countryconfig may not have pushed its branch yet.
      # Skipped if the farajaland release branch was already created by a
      # previous run (countryconfig's branch must exist at that point already).
      - name: Wait for countryconfig release branch
        if: steps.check_branch.outputs.exists == 'false'
        run: |
          RELEASE_BRANCH="release/${{ inputs.version }}"
          for i in $(seq 1 20); do
            if git ls-remote --exit-code --heads \
                https://github.com/opencrvs/opencrvs-countryconfig.git \
                "$RELEASE_BRANCH" > /dev/null 2>&1; then
              echo "countryconfig/$RELEASE_BRANCH is available."
              exit 0
            fi
            if [ "$i" -eq 20 ]; then
              echo "Timed out waiting for countryconfig/$RELEASE_BRANCH." >&2
              exit 1
            fi
            echo "Attempt $i/20: waiting 30s for countryconfig/$RELEASE_BRANCH..."
            sleep 30
          done

      # Create farajaland's release branch from its own base, then merge
      # countryconfig's release branch in. This brings version-bump commits
      # into farajaland so PRs have a real diff.
      # Skipped if the release branch was already created by a previous run.
      - name: Create release branch
        if: steps.check_branch.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout "${{ steps.get_base_branch.outputs.base_branch }}"
          git checkout -b "release/${{ inputs.version }}"

          git remote add countryconfig https://github.com/opencrvs/opencrvs-countryconfig.git
          git fetch countryconfig "release/${{ inputs.version }}"
          git merge --no-edit "countryconfig/release/${{ inputs.version }}"

          git push origin "release/${{ inputs.version }}"

      # A dedicated merge-back branch is used so that any conflict-resolution
      # commits do not land on the release branch itself.
      #   - current channel: branched off release/<version> and PR'd into
      #     develop, so the diff is the release's own commits.
      #   - older channel: branched off the target release branch with
      #     release/<version> merged into it, so the diff is exactly what the
      #     older channel adds to the newer one.
      - name: Create merge-back branch
        id: merge_back
        run: |
          MERGEBACK_BRANCH="${{ steps.get_base_branch.outputs.mergeback_branch }}"
          MERGE_BACK_TARGET="${{ steps.get_base_branch.outputs.merge_back_target }}"
          RELEASE_BRANCH="release/${{ inputs.version }}"

          if git ls-remote --exit-code --heads origin "$MERGEBACK_BRANCH" > /dev/null 2>&1; then
            echo "Branch $MERGEBACK_BRANCH already exists, skipping."
            exit 0
          fi

          # The step above sets these too, but it is skipped when the release
          # branch already exists — and the merge below needs an author.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin "$RELEASE_BRANCH"

          if [ "$MERGE_BACK_TARGET" = "develop" ]; then
            git checkout -b "$MERGEBACK_BRANCH" "origin/$RELEASE_BRANCH"
          else
            git fetch origin "$MERGE_BACK_TARGET"
            git checkout -b "$MERGEBACK_BRANCH" "origin/$MERGE_BACK_TARGET"
            if ! git merge --no-edit "origin/$RELEASE_BRANCH"; then
              # The two channels always disagree on the version fields and on the
              # top of the CHANGELOG — both sides bumped them away from the same
              # ancestor — and that conflict always resolves the same way: the
              # channel being merged into keeps its own numbers. Anything else is
              # a real conflict that a human has to look at.
              CONFLICTS=$(git diff --name-only --diff-filter=U)
              UNEXPECTED=$(echo "$CONFLICTS" | grep -Ev '(^|/)package\.json$|^CHANGELOG\.md$' || true)
              if [ -n "$UNEXPECTED" ]; then
                git merge --abort
                echo "::error::$RELEASE_BRANCH does not merge cleanly into $MERGE_BACK_TARGET ($(echo $UNEXPECTED | tr '\n' ' ')). Create $MERGEBACK_BRANCH from $MERGE_BACK_TARGET by hand, merge $RELEASE_BRANCH into it, push it, then re-run this workflow."
                exit 1
              fi
              echo "$CONFLICTS" | while IFS= read -r file; do
                [ -n "$file" ] && git checkout --ours -- "$file"
              done
              git add -A
              git commit --no-edit
              RESOLVED=$(echo "$CONFLICTS" | tr '\n' ' ')
              echo "Kept $MERGE_BACK_TARGET's copy of: $RESOLVED"
              echo "auto_resolved=$RESOLVED" >> $GITHUB_OUTPUT
            fi
          fi

          git push origin "$MERGEBACK_BRANCH"

      # Up to two PRs are created:
      #
      #   PR 1 — release/<version> → master
      #     The release PR. Opened only for a release on the current channel; an
      #     older-channel hotfix never targets master directly.
      #
      #   PR 2 — merge-back/release-<version>-into-<target> → <target>
      #     develop for the current channel, the release branch one channel up
      #     for an older-channel hotfix. Uses a dedicated branch so
      #     conflict-resolution commits stay off the release branch.
      #       - z=0 (base is develop): initially an empty diff; useful once
      #         release-branch fixes are cherry-picked.
      #       - z>0 (base is a prior release branch): backports patch fixes.
      # Each PR is checked individually — one may already exist while the other
      # does not, so both are always evaluated.
      - name: Create Pull Requests
        run: |
          PR_BRANCH="release/${{ inputs.version }}"
          MERGEBACK_BRANCH="${{ steps.get_base_branch.outputs.mergeback_branch }}"
          MERGE_BACK_TARGET="${{ steps.get_base_branch.outputs.merge_back_target }}"
          RELEASE_PR="${{ steps.get_base_branch.outputs.release_pr }}"
          AUTO_RESOLVED="${{ steps.merge_back.outputs.auto_resolved }}"

          if [ -f .github/TEMPLATES/RELEASE_PR_TEMPLATE.md ]; then
            BODY=$(cat .github/TEMPLATES/RELEASE_PR_TEMPLATE.md)
          else
            BODY=""
          fi

          if [ "$RELEASE_PR" = "true" ]; then
            EXISTING_MASTER_PR=$(gh pr list --head "$PR_BRANCH" --base "master" --state open --json number --jq '.[0].number // ""')
            if [ -z "$EXISTING_MASTER_PR" ]; then
              gh pr create \
                --base "master" \
                --head "$PR_BRANCH" \
                --title "Release v${{ inputs.version }}" \
                --body "$BODY"
            else
              echo "PR $PR_BRANCH → master already exists (#$EXISTING_MASTER_PR), skipping."
            fi

            MERGEBACK_TITLE="chore: merge release v${{ inputs.version }} back to develop"
            MERGEBACK_BODY="Merge release branch back to develop to keep develop in sync with any release-branch fixes."
          else
            echo "Skipping the release PR to master: ${{ inputs.version }} is on an older channel."

            MERGEBACK_TITLE="chore: merge release v${{ inputs.version }} into $MERGE_BACK_TARGET"
            MERGEBACK_BODY="${BODY}

          ---

          > **Note:** \`${{ inputs.version }}\` is on an older channel than the one \`master\` tracks, so no release PR to \`master\` is opened. This PR carries the release up into \`$MERGE_BACK_TARGET\`, and it reaches \`master\` and \`develop\` through that channel's own release."

            if [ -n "$AUTO_RESOLVED" ]; then
              MERGEBACK_BODY="${MERGEBACK_BODY}

          > The merge kept \`$MERGE_BACK_TARGET\`'s copy of: $AUTO_RESOLVED — the version bump and changelog entry belong to \`${{ inputs.version }}\`'s own channel. Check that nothing else in those files needed to come across."
            fi
          fi

          EXISTING_MERGEBACK_PR=$(gh pr list --head "$MERGEBACK_BRANCH" --base "$MERGE_BACK_TARGET" --state open --json number --jq '.[0].number // ""')
          if [ -z "$EXISTING_MERGEBACK_PR" ]; then
            gh pr create \
              --base "$MERGE_BACK_TARGET" \
              --head "$MERGEBACK_BRANCH" \
              --title "$MERGEBACK_TITLE" \
              --body "$MERGEBACK_BODY"
          else
            echo "PR $MERGEBACK_BRANCH → $MERGE_BACK_TARGET already exists (#$EXISTING_MERGEBACK_PR), skipping."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
