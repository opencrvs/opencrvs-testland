# Starts a release. Dispatched by opencrvs-core's init-release, or run manually
# with a semver version.
#
# Farajaland mirrors opencrvs-countryconfig with its own changes on top. The
# version bump and CHANGELOG entry live in countryconfig; the release branch
# here is cut from the previous patch — or from develop for a minor or major —
# and inherits them by merging countryconfig's release branch. Where it merges
# comes from core as target_branch — core is the only repo that knows which
# channel master tracks, so this one never derives it:
#
#   master        release/<version> -> master, plus a merge-back into develop
#   release/<v>   an older channel. No PR to master. One merge-back PR into
#                 that branch, which carries the release onwards.
#
# TODO: this repo only cuts release branches on the 1.9.x line. Remove this
# workflow, and the PRs it opens, once this branch reaches develop.
name: Release - Start a new release
on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
        description: 'Version to release'
      target_branch:
        type: string
        required: false
        default: 'master'
        description: 'Branch this release merges into, passed down by opencrvs-core. master for the current channel, or the release branch one channel up (e.g. release/2.0.2) for an older one.'

env:
  VERSION: ${{ inputs.version }}
  RELEASE_BRANCH: release/${{ inputs.version }}
  COUNTRYCONFIG: https://github.com/opencrvs/opencrvs-countryconfig.git

jobs:
  release_workflow:
    runs-on: ubuntu-latest
    steps:
      # Full history is required for the git operations below.
      - name: Checkout the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine the branches
        id: branches
        run: |
          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not a semver version, e.g. 1.9.17"
            exit 1
          fi

          IFS='.' read -r x y z <<< "$VERSION"
          if [ "$z" = "0" ]; then
            base_branch=develop
          else
            base_branch="release/$x.$y.$((z - 1))"
            if ! git ls-remote --exit-code --heads origin "$base_branch" > /dev/null 2>&1; then
              echo "::error::$base_branch does not exist. Create it before starting a patch release."
              exit 1
            fi
          fi

          target="${{ inputs.target_branch }}"
          if [ -z "$target" ]; then
            target=master
          fi

          if [ "$target" = "master" ]; then
            merge_back=develop
          else
            merge_back="$target"
          fi

          # Dots are stripped so the name passes the branch-name check used
          # across the repos: 1.9.17 into 2.0.2 -> merge-back/release-1917-into-202.
          slug="${merge_back#release/}"
          echo "$VERSION -> $target, merging back into $merge_back"
          echo "base_branch=$base_branch" >> $GITHUB_OUTPUT
          echo "target_branch=$target" >> $GITHUB_OUTPUT
          echo "merge_back_target=$merge_back" >> $GITHUB_OUTPUT
          echo "mergeback_branch=merge-back/release-${VERSION//./}-into-${slug//./}" >> $GITHUB_OUTPUT

      # The target must already exist: its own release cuts it. Fail before
      # anything is created.
      - name: Verify the target release branch exists
        if: steps.branches.outputs.target_branch != 'master'
        run: |
          TARGET="${{ steps.branches.outputs.target_branch }}"
          if ! git ls-remote --exit-code --heads origin "$TARGET" > /dev/null 2>&1; then
            echo "::error::$TARGET does not exist in this repository. Start the ${TARGET#release/} release here first."
            exit 1
          fi

      - name: Configure the git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Cut from farajaland's own base, then merge countryconfig's release
      # branch in so the PRs carry its bump commits. Core dispatches both repos
      # at once, so countryconfig may not have pushed its branch yet.
      - name: Create the release branch
        run: |
          if git ls-remote --exit-code --heads origin "$RELEASE_BRANCH" > /dev/null 2>&1; then
            echo "$RELEASE_BRANCH already exists, skipping."
            exit 0
          fi

          for i in $(seq 1 20); do
            if git ls-remote --exit-code --heads "$COUNTRYCONFIG" "$RELEASE_BRANCH" > /dev/null 2>&1; then
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "::error::Timed out waiting for countryconfig/$RELEASE_BRANCH."
              exit 1
            fi
            echo "Attempt $i/20: waiting 30s for countryconfig/$RELEASE_BRANCH..."
            sleep 30
          done

          git checkout "${{ steps.branches.outputs.base_branch }}"
          git checkout -b "$RELEASE_BRANCH"

          git fetch "$COUNTRYCONFIG" "$RELEASE_BRANCH"
          git merge --no-edit FETCH_HEAD

          git push origin "$RELEASE_BRANCH"

      # A dedicated branch keeps the commits that resolve conflicts with the
      # target off the release branch. For an older channel it is cut from the
      # target with the release merged in, so the PR diff is only what this
      # channel adds. A merge needing a human is handed over in the job summary
      # instead of failing the release.
      - name: Create the merge-back branch
        id: merge_back
        run: |
          BRANCH="${{ steps.branches.outputs.mergeback_branch }}"
          TARGET="${{ steps.branches.outputs.merge_back_target }}"

          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
            echo "$BRANCH already exists, skipping."
            echo "created=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "$TARGET" = "develop" ]; then
            git fetch origin "$RELEASE_BRANCH"
            git checkout -b "$BRANCH" "origin/$RELEASE_BRANCH"
          else
            git fetch origin "$RELEASE_BRANCH" "$TARGET"
            git checkout -b "$BRANCH" "origin/$TARGET"

            if ! git merge --no-edit "origin/$RELEASE_BRANCH"; then
              # Both channels bump the version fields and the CHANGELOG, so those
              # always conflict and always resolve the same way: the target keeps
              # its own. Anything else needs a human.
              conflicts=$(git diff --name-only --diff-filter=U)
              unexpected=$(echo "$conflicts" | grep -Ev '(^|/)package\.json$|^CHANGELOG\.md$' || true)

              if [ -n "$unexpected" ]; then
                git merge --abort
                echo "::warning::$RELEASE_BRANCH does not merge cleanly into $TARGET; the merge-back branch and its PR were skipped."
                {
                  echo "### Merge $VERSION into $TARGET by hand"
                  echo ""
                  echo "Conflicts in: ${unexpected//$'\n'/, }"
                  echo ""
                  echo "Cut \`$BRANCH\` from \`$TARGET\`, merge \`$RELEASE_BRANCH\` in, resolve, push, then re-run this workflow to open the PR."
                } >> "$GITHUB_STEP_SUMMARY"
                echo "created=false" >> $GITHUB_OUTPUT
                exit 0
              fi

              # A file the target deleted has no "ours" side, so it stays deleted.
              while IFS= read -r file; do
                if git ls-files --unmerged -- "$file" | awk '{print $3}' | grep -qx 2; then
                  git checkout --ours -- "$file"
                  git add -- "$file"
                else
                  git rm -q -f -- "$file"
                fi
              done <<< "$conflicts"

              git commit --no-edit
              echo "Kept $TARGET's copy of: ${conflicts//$'\n'/ }"
              echo "auto_resolved=${conflicts//$'\n'/ }" >> $GITHUB_OUTPUT
            fi
          fi

          git push origin "$BRANCH"
          echo "created=true" >> $GITHUB_OUTPUT

      - name: Create the pull requests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.branches.outputs.mergeback_branch }}"
          TARGET="${{ steps.branches.outputs.merge_back_target }}"
          RESOLVED="${{ steps.merge_back.outputs.auto_resolved }}"

          # base, head, title, body. An already-open PR is left alone, so a
          # re-run opens only the missing one.
          create_pr() {
            local open
            open=$(gh pr list --head "$2" --base "$1" --state open --json number --jq '.[0].number // ""')
            if [ -n "$open" ]; then
              echo "PR $2 -> $1 already exists (#$open), skipping."
            else
              gh pr create --base "$1" --head "$2" --title "$3" --body "$4"
            fi
          }

          BODY=""
          if [ -f .github/TEMPLATES/RELEASE_PR_TEMPLATE.md ]; then
            BODY=$(cat .github/TEMPLATES/RELEASE_PR_TEMPLATE.md)
          fi

          if [ "$TARGET" = "develop" ]; then
            create_pr master "$RELEASE_BRANCH" "Release v$VERSION" "$BODY"
            TITLE="chore: merge release v$VERSION back to develop"
            NOTE="Merge release branch back to develop to keep develop in sync with any release-branch fixes."
          else
            echo "$VERSION is on an older channel than master, so no release PR to master."
            TITLE="chore: merge release v$VERSION into $TARGET"
            NOTE="$BODY

          ---

          > **Note:** \`$VERSION\` is on an older channel than the one \`master\` tracks, so no release PR to \`master\` is opened. This PR carries the release up into \`$TARGET\`, and it reaches \`master\` and \`develop\` through that channel's own release."

            if [ -n "$RESOLVED" ]; then
              NOTE="$NOTE

          > The merge kept \`$TARGET\`'s copy of: $RESOLVED — the version bump and changelog entry belong to \`$VERSION\`'s own channel. Check that nothing else in those files needed to come across."
            fi
          fi

          if [ "${{ steps.merge_back.outputs.created }}" = "true" ]; then
            create_pr "$TARGET" "$BRANCH" "$TITLE" "$NOTE"
          else
            echo "No merge-back branch to open a PR from — see the job summary."
          fi
