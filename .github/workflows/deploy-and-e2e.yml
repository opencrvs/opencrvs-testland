name: Deploy & run E2E
run-name: Deploy & E2E, triggered by ${{ github.event.client_payload.actor || github.actor }} to ${{ github.event.inputs.environment || 'e2e' }}
on:
  repository_dispatch:
    types: [run_e2e]
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: Environment to deploy to
        required: true
        default: 'e2e'
        options:
          - e2e
      core-image-tag:
        description: Core image tag
        required: true
        default: 'v1.6.0'
      countryconfig-image-tag:
        description: Your Country Config image tag
        required: true
        default: 'v1.6.0'

concurrency:
  group: ci-build
  cancel-in-progress: false

jobs:
  get-core-commit:
    name: Resolve latest core tag
    runs-on: ubuntu-latest
    outputs:
      latest_commit_sha: ${{ steps.get_latest_commit.outputs.commit_sha }}
    steps:
      - name: Checkout opencrvs-core repository
        if: github.event_name == 'push' || github.event_name == 'repository_dispatch'
        uses: actions/checkout@v3
        with:
          repository: 'opencrvs/opencrvs-core'
          ref: 'develop'
      - name: Get latest commit SHA
        if: github.event_name == 'push' || github.event_name == 'repository_dispatch'
        id: get_latest_commit
        run: echo "commit_sha=$(git rev-parse HEAD | cut -c 1-7)" >> $GITHUB_OUTPUT

  get-country-config-commit:
    name: Resolve latest Farajaland tag
    runs-on: ubuntu-latest
    needs: get-core-commit
    outputs:
      short_sha: ${{ steps.set_short_sha.outputs.short_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        if: github.event_name == 'push' || github.event_name == 'repository_dispatch'
      - name: Get short commit hash
        id: set_short_sha
        run: echo "short_sha=${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT
        if: github.event_name == 'push' || github.event_name == 'repository_dispatch'

  deploy:
    needs: [get-country-config-commit, get-core-commit]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: ${{ github.event.inputs.environment || 'e2e' }}
      core-image-tag: ${{ github.event.inputs.core-image-tag || needs.get-core-commit.outputs.latest_commit_sha }}
      countryconfig-image-tag: ${{ github.event.inputs.countryconfig-image-tag || needs.get-country-config-commit.outputs.short_sha }}
      reset: 'true'
    secrets: inherit

  discover-tests:
    name: Discover test directories
    runs-on: ubuntu-22.04
    needs: [get-core-commit, get-country-config-commit]
    outputs:
      test_matrix: ${{ steps.list-tests.outputs.test_matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Emits the spec list already ordered for the `test` matrix below; see that
      # job for why the order matters. Replaces a plain
      # `find * -type f -name "*.spec.ts"`, which silently skipped `.spec.tsx`
      # (Playwright's default testMatch accepts both), so any `.tsx` spec never
      # ran in CI.
      #
      # MERGE-BACK TO DEVELOP: develop deleted this whole job in 0f63dd8af and
      # runs e2e from `opencrvs-testland-infrastructure` instead, so resolving
      # this conflict in develop's favour is correct -- and when you do, also
      # `git rm .github/scripts/list-e2e-specs.mjs`. That file is a path develop
      # does not have, so it merges in WITHOUT a conflict and would otherwise be
      # left behind as dead code with no caller.
      - name: List Test Directories
        id: list-tests
        run: |
          tests_suites=$(node .github/scripts/list-e2e-specs.mjs)
          echo "Test suites: $tests_suites"
          echo "test_matrix=$tests_suites" >> $GITHUB_OUTPUT
      - name: Cache Node.js dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/yarn/v6
          key: ${{github.event.inputs.countryconfig-image-tag || needs.get-country-config-commit.outputs.short_sha}}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: yarn
  test:
    needs: [deploy, discover-tests, get-core-commit, get-country-config-commit]
    runs-on: ubuntu-22.04
    environment: ${{ github.event.inputs.environment || 'e2e' }}
    # The default is 360 minutes, so a wedged spec holds a runner for six hours.
    # The largest spec has ~60 tests at a 90s per-test timeout.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # One job per spec file, all pointed at a SINGLE shared environment, so
        # the start order decides which specs contend with each other. Ordered by
        # .github/scripts/list-e2e-specs.mjs rather than alphabetically:
        #
        #   - round-robin across top-level directories, so concurrently started
        #     jobs sit on unrelated domains instead of all hitting the same
        #     workqueues and seeded users (alphabetical order started all 20
        #     birth/ specs together);
        #   - heaviest spec first, so a long spec does not become the tail every
        #     other job waits behind.
        #
        # There is deliberately no `max-parallel`: develop has no matrix left to
        # match (see the discover-tests step), so capping here would be
        # release-only churn. If the shared environment turns out to be the
        # bottleneck, that is the knob to reach for.
        test_file: ${{ fromJson(needs.discover-tests.outputs.test_matrix) }}
    name: ${{ matrix.test_file }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Cache Node.js dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/yarn/v6
          key: ${{github.event.inputs.countryconfig-image-tag || needs.get-country-config-commit.outputs.short_sha}}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: yarn

      - uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npx playwright install --with-deps

      - name: Run Playwright Tests
        run: npx playwright test ./e2e/testcases/${{ matrix.test_file }}
        env:
          DOMAIN: '${{ vars.DOMAIN }}'

      - id: ctrf_check
        if: always()
        run: |
          [ -d ctrf ] && \
            echo "ctrf=true" >> $GITHUB_OUTPUT || \
            echo "ctrf=false" >> $GITHUB_OUTPUT
      - name: Publish Test Summary Results
        run: npx github-actions-ctrf ctrf/ctrf-report.json
        if: always() && steps.ctrf_check.outputs.ctrf == 'true'

      - name: Form the artifact name from test_file
        if: always()
        id: artifact
        run: echo "artifact=$(echo '${{ matrix.test_file }}' | sed 's/\//__/g')" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{github.event.inputs.core-image-tag || needs.get-core-commit.outputs.latest_commit_sha}}-${{github.event.inputs.countryconfig-image-tag || needs.get-country-config-commit.outputs.short_sha}}-${{ steps.artifact.outputs.artifact }}
          path: playwright-report/
          retention-days: 30

  notify-slack:
    name: Notify Slack on Failure
    runs-on: ubuntu-latest
    needs: [deploy, discover-tests, test]
    if: always() && failure()
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: 'C02LU432JGK'
          slack-message: "❌ E2E pipeline triggered by ${{ github.event.client_payload.actor || github.actor }}'s commit failed. Check the logs at https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}."
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  notify-slack-success:
    name: Notify Slack on success
    runs-on: ubuntu-latest
    needs: [deploy, discover-tests, test]
    if: success()
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: 'C02LU432JGK'
          slack-message: '✅ E2E pipeline finished successfully, triggered by ${{ github.event.client_payload.actor || github.actor }}. Check the logs at https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}.'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
